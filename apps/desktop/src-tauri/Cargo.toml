[package]
name = "harness-desktop"
version = "0.1.0"
description = "DeepSeek Harness Desktop — unofficial macOS client over the DeepSeek Harness runtime"
edition = "2021"
repository = "https://github.com/Alexmen97/deepseek-harness-app"

[lib]
name = "harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native"] }
rfd = "0.15"
os_info = "3"
base64 = "0.22"
notify = "8"

[profile.release]
codegen-units = 1
lto = true
strip = true
