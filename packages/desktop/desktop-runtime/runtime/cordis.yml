# DeepSeek Harness desktop runtime composition. The macOS desktop host spawns
# the packaged executable with DSH_CORDIS_CONFIG pointing at this file (or at
# a user overlay); bare plugin names resolve from the packaged runtime
# closure. stdout is reserved for JSON-RPC frames, so no stdout logger is
# mounted. DSH_SESSION_ROOT, DSH_CWD, DSH_HOME, and DSH_PERMISSION_MODE are
# the deployment seams the host sets; DEEPSEEK_API_KEY arrives through the
# credential seam (environment in M1A, see docs/desktop/CREDENTIALS.md).

# The executor-less agent spine: llm, session, tools, agent, loop, skills.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.
    workspaceContext:
      maxBytes: 65536

# Stock DeepSeek adapter; the adapter resolves DEEPSEEK_API_KEY through the
# credential seam and, with no provider mounted here, from the launching
# environment. This file names no secret and no route.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

# The transport-independent default for agents created by the desktop surface.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

# JSONL session durability; $DSH_SESSION_ROOT wins over the harness home.
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? dshHomePath('sessions')

# Durability checkpoints before each model request and top-level dispatch.
- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# Whole-log projection registry and its persisted cache (session list rows).
- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: session-projection-cache
  name: '@deepseek-ai/dsh-session-projection-cache'
  config:
    writeEveryEvents: 200
    writeIntervalMs: 5000

# Full-text session search is opt-in (openAt: never keeps exact reads,
# titles, and lineage traces while SQLite stays closed).
- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: ':memory:'
    openAt: never

# Process substrate and the sandbox-confined bash executor for the spine's
# bash tool (the permission presets require a confining executor).
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

# File-effect boundary and approval-driven escalation. Fresh sessions pin
# workspace-write and ask through the approval service below.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()

- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  config:
    timeoutMs: 60000
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never

- id: questions
  name: '@deepseek-ai/dsh-user-questions'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# Local filesystem provider and the model-facing file tools.
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# User-settings document and the Keychain credential provider (env fallback
# for tests and development mode only).
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

# The locale settings section the browser client persists its preference in.
- id: client-locale
  name: '@deepseek-ai/dsh-client-locale'

- id: ui-settings-general
  name: '@deepseek-ai/dsh-client-ui-settings-general'

- id: ui-theme
  name: '@deepseek-ai/dsh-client-ui-theme'

- id: credentials
  name: '@deepseek-ai/dsh-credentials-keychain'

# Durable image bytes outside the append-only session log.
- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'

# Storage hub the workspace registry persists through.
- id: storage
  name: '@deepseek-ai/dsh-storage'

- id: storage-json
  name: '@deepseek-ai/dsh-storage-json'
  config:
    root: !!js dshHomePath('storages')

- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json

- id: workspace
  name: '@deepseek-ai/dsh-workspace'

# Subagent registry with the in-process provider (session lineage frames).
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

# Native directory picker backend (the gateway service requires the seam).
- id: directory-picker
  name: '@deepseek-ai/dsh-host-directory-picker-native'

# The transport-agnostic gateway face every client shape shares.
- id: api-gateway
  name: '@deepseek-ai/dsh-host-apiproxy'

# Desktop identity and the stdio JSON-RPC carrier.
- id: desktop-runtime-info
  name: '@deepseek-ai/dsh-desktop-runtime/info'

- id: desktop-jsonrpc-server
  name: '@deepseek-ai/dsh-desktop-jsonrpc-server'
  config:
    keychain: true
