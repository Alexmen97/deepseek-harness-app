# Keyless replay include over the live desktop runtime composition: disables
# the key-requiring DeepSeek adapter and inserts llm-replay to serve recorded
# JSONL without a key or network. With DSH_SNAPSHOT=replay the app bin reads
# DSH_SNAPSHOT_FILE and optional DSH_SNAPSHOT_OVERRIDE from the harness. The
# sandbox row switches to a passthrough runner so the recorded bash calls
# execute deterministically on any host.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: sandbox
        name: '@deepseek-ai/dsh-sandbox-local'
        config:
          runnerCommand:
            - bash
            - -c
            - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
            - passthrough-runner
          runnerFailureSignatures:
            - 'passthrough-runner: profile rejected'
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  retryPolicy:
                    mode: normal
                    backoff:
                      initialDelayMs: 1
                      maxDelayMs: 1
                      jitterRatio: 0
                  models:
                    - id: deepseek-v4-flash
                      contextWindow: 128000
