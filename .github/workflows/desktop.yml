name: Desktop

on:
  push:
    branches: [main]
  # No path filter: the checks job is a required check on main, and a
  # path-filtered workflow would leave pull requests without a verdict.
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Build and typecheck
        # The desktop runtime tests below boot plugins from lib/ bundles, so
        # both tsdown faces must run; the build also typechecks both programs.
        run: |
          pnpm run build
          pnpm exec tsc -p apps/desktop
      - name: Lint
        run: pnpm exec oxlint -c .oxlintrc.json packages/desktop packages/credentials/credentials-keychain packages/api/gateway/src/client apps/desktop/src apps/desktop/tests
      - name: Desktop test suites
        run: pnpm exec vitest run packages/desktop packages/credentials/credentials-keychain packages/api/gateway packages/api/remotes apps/desktop/tests
      - name: Localization coverage
        run: pnpm run desktop:i18n:check
      - name: Hardcoded desktop copy scan
        run: pnpm run desktop:hardcoded-strings
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: |
          # tauri-build validates declared bundle resources even for unit tests
          # and generate_context! reads the icon; the deterministic staging
          # script and the resource regression check own that contract.
          node ../../../scripts/prepare-desktop-rust-tests.mjs
          node ../../../scripts/check-desktop-rust-resources.mjs
          cargo test --lib
      - name: Frontend build
        working-directory: apps/desktop
        run: pnpm exec vite build

  release-unsigned:
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Build runtime executable
        run: node --import tsx/esm scripts/build-exe-for-desktop.ts
      - name: Build app bundle
        working-directory: apps/desktop
        run: pnpm exec tauri build --config '{"version":"0.1.0-preview.1"}'
      - name: Sign preview app (ad-hoc)
        run: node scripts/sign-desktop.mjs --mode adhoc-hardened
      - name: Release verification (preview)
        env:
          DESKTOP_RELEASE_KIND: preview
          DESKTOP_SIGNING: adhoc
          DESKTOP_NOTARIZED: "false"
        run: node scripts/verify-desktop-release.mjs
      - name: DMG, checksum, release manifest (preview)
        env:
          DESKTOP_RELEASE_VERSION: 0.1.0-preview.1
          DESKTOP_RELEASE_KIND: preview
          DESKTOP_SIGNING: adhoc
          DESKTOP_NOTARIZED: "false"
        run: node scripts/make-desktop-dmg.mjs
      - name: DMG contents verification (preview)
        env:
          DESKTOP_RELEASE_VERSION: 0.1.0-preview.1
        run: node scripts/verify-desktop-dmg.mjs
      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-App-preview-arm64
          path: |
            apps/desktop/src-tauri/target/release/bundle/macos/Harness Desktop.app
            dist-exe/*.dmg
            dist-exe/*.dmg.sha256
            dist-exe/*-release-manifest.json

  release-signed:
    needs: checks
    runs-on: macos-15
    environment: desktop-release
    if: vars.APPLE_SIGNING_IDENTITY != '' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_KEYCHAIN_PASSWORD" build.keychain
      - name: Build runtime executable
        run: node --import tsx/esm scripts/build-exe-for-desktop.ts
      - name: Build app bundle
        working-directory: apps/desktop
        run: pnpm exec tauri build
      - name: Sign, notarize, staple
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/sign-desktop.mjs --mode developer-id
      - name: DMG
        run: node scripts/make-desktop-dmg.mjs
      - name: Release verification (signed)
        run: node scripts/verify-desktop-release.mjs
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-App-signed-arm64
          path: |
            apps/desktop/src-tauri/target/release/bundle/macos/Harness Desktop.app
            dist-exe/*.dmg
