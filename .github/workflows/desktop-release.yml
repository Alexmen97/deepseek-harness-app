name: Desktop release

# Two explicit release classes.
#   production  Developer ID signed, notarized, stapled DMG; publishes as a
#               DRAFT prerelease from a v* tag so a maintainer reviews it
#               before it becomes public. Without Developer ID signing and
#               notarization credentials the build FAILS instead of
#               publishing an unsigned artifact.
#   preview     ad-hoc signed, NOT notarized DMG; publishes a GitHub
#               Pre-release only when explicitly requested (manual dispatch
#               with dry_run=false, release_kind=preview, and an explicit
#               release_version input, or a vX.Y.Z-preview.N tag). A plain
#               push to main publishes nothing.

on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: Release class (preview or production)
        type: choice
        options:
          - preview
          - production
        default: preview
      dry_run:
        description: Build and verify without creating a GitHub Release
        type: boolean
        default: true
      release_version:
        description: Release version (X.Y.Z or X.Y.Z-preview.N, no leading v)
        type: string
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signing-secrets:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      signed: ${{ steps.decide.outputs.signed }}
      notarized: ${{ steps.decide.outputs.notarized }}
    steps:
      - id: decide
        env:
          HAS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          HAS_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          HAS_API_KEY: ${{ secrets.APPLE_API_KEY }}
          HAS_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          HAS_P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID }}
          HAS_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          HAS_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$HAS_CERTIFICATE" ] && [ -n "$HAS_IDENTITY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          if { [ -n "$HAS_API_KEY" ] && [ -n "$HAS_ISSUER" ] && [ -n "$HAS_P8" ]; } || { [ -n "$HAS_APPLE_ID" ] && [ -n "$HAS_APP_PASSWORD" ] && [ -n "$HAS_TEAM" ]; }; then
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: signing-secrets
    runs-on: macos-15
    environment: release
    outputs:
      signed: ${{ needs.signing-secrets.outputs.signed }}
      notarized: ${{ needs.signing-secrets.outputs.notarized }}
      releaseKind: ${{ steps.decide.outputs.kind }}
      releaseVersion: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Record runner environment
        run: |
          uname -m
          sw_vers
          node --version
      - name: Decide release class
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          DISPATCH_KIND: ${{ inputs.release_kind }}
          DISPATCH_VERSION: ${{ inputs.release_version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            RESOLVED=$(node scripts/resolve-release-version.mjs --input "$DISPATCH_VERSION") || { echo "::error::$RESOLVED"; exit 1; }
          else
            RESOLVED=$(node scripts/resolve-release-version.mjs --tag "$REF") || { echo "::error::$RESOLVED"; exit 1; }
          fi
          VERSION=$(printf "%s\n" "$RESOLVED" | sed -n "s/^version=//p")
          KIND=$(printf "%s\n" "$RESOLVED" | sed -n "s/^kind=//p")
          if [ -z "$VERSION" ] || [ -z "$KIND" ]; then
            echo "::error::resolve-release-version emitted an unexpected response: $RESOLVED"
            exit 1
          fi
          if [ "$DISPATCH_KIND" = "production" ] && [ "$KIND" != "production" ]; then
            echo "::error::manual dispatch kind production requires a production version input, got $DISPATCH_VERSION"
            exit 1
          fi
          if [ "$DISPATCH_KIND" = "preview" ] && [ "$KIND" != "preview" ]; then
            echo "::error::manual dispatch kind preview requires a preview version input, got $DISPATCH_VERSION"
            exit 1
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Decide release metadata
        id: meta
        env:
          KIND: ${{ steps.decide.outputs.kind }}
          VERSION: ${{ steps.decide.outputs.version }}
          SIGNED: ${{ needs.signing-secrets.outputs.signed }}
          NOTARIZED_CREDS: ${{ needs.signing-secrets.outputs.notarized }}
        run: |
          if [ "$KIND" = "preview" ]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "signing=adhoc" >> "$GITHUB_OUTPUT"
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            if [ "$SIGNED" = "true" ] && [ "$NOTARIZED_CREDS" = "true" ]; then
              echo "signing=developer-id" >> "$GITHUB_OUTPUT"
              echo "notarized=true" >> "$GITHUB_OUTPUT"
            else
              echo "signing=adhoc" >> "$GITHUB_OUTPUT"
              echo "notarized=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - run: pnpm install --frozen-lockfile
      - name: Build and typecheck
        run: |
          pnpm run build
          pnpm exec tsc -p apps/desktop
      - name: Desktop tests
        run: pnpm exec vitest run packages/desktop packages/credentials/credentials-keychain packages/api/gateway packages/api/remotes apps/desktop/tests
      - name: Localization coverage
        run: pnpm run desktop:i18n:check
      - name: Hardcoded desktop copy scan
        run: pnpm run desktop:hardcoded-strings
      - name: Stage desktop Rust-test resources
        run: node scripts/prepare-desktop-rust-tests.mjs
      - name: Rust-test resource regression check
        run: node scripts/check-desktop-rust-resources.mjs
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib
      - name: Build runtime executable
        run: node --import tsx/esm scripts/build-exe-for-desktop.ts
      - name: Restore full workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend build
        working-directory: apps/desktop
        run: pnpm exec vite build
      - name: Build app bundle
        working-directory: apps/desktop
        env:
          KIND: ${{ steps.decide.outputs.kind }}
        run: |
          if [ "$KIND" = "preview" ]; then
            pnpm exec tauri build --config "{\"version\":\"${{ steps.meta.outputs.version }}\"}"
          else
            pnpm exec tauri build
          fi
      - name: Verify spawn helper in the app bundle
        run: node scripts/check-desktop-spawn-helper.mjs "apps/desktop/src-tauri/target/release/bundle/macos/Harness Desktop.app"
      - name: Import signing certificate
        if: steps.decide.outputs.kind == 'production' && needs.signing-secrets.outputs.signed == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_KEYCHAIN_PASSWORD" build.keychain
      - name: Sign preview app (ad-hoc)
        if: steps.decide.outputs.kind == 'preview'
        run: node scripts/sign-desktop.mjs --mode adhoc-hardened
      - name: Sign, notarize, staple (production)
        if: steps.decide.outputs.kind == 'production' && needs.signing-secrets.outputs.signed == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
            echo -n "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          fi
          node scripts/sign-desktop.mjs --mode developer-id
      - name: Verify signing identity (production)
        if: steps.decide.outputs.kind == 'production' && needs.signing-secrets.outputs.signed == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          security find-identity -v -p codesigning build.keychain | grep -F "$APPLE_SIGNING_IDENTITY" > /dev/null || {
            echo "::error::Developer ID identity not found in the imported keychain"
            exit 1
          }
      - name: DMG, checksum, release manifest
        env:
          DESKTOP_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          DESKTOP_RELEASE_KIND: ${{ steps.decide.outputs.kind }}
          DESKTOP_SIGNING: ${{ steps.meta.outputs.signing }}
          DESKTOP_NOTARIZED: ${{ steps.meta.outputs.notarized }}
        run: node scripts/make-desktop-dmg.mjs
      - name: DMG contents verification
        env:
          DESKTOP_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: node scripts/verify-desktop-dmg.mjs
      - name: SBOM
        env:
          DESKTOP_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: pnpm run desktop:sbom
      - name: Release artifact consistency
        env:
          DESKTOP_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: node scripts/check-release-consistency.mjs
      - name: Release verification
        env:
          DESKTOP_RELEASE_KIND: ${{ steps.decide.outputs.kind }}
          DESKTOP_SIGNING: ${{ steps.meta.outputs.signing }}
          DESKTOP_NOTARIZED: ${{ steps.meta.outputs.notarized }}
        run: node scripts/verify-desktop-release.mjs
      - name: Refuse unsigned tag publication
        if: steps.decide.outputs.kind == 'production' && (needs.signing-secrets.outputs.signed != 'true' || needs.signing-secrets.outputs.notarized != 'true')
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "push" ] || [ "$DRY_RUN" = "false" ]; then
            echo "::error::Refusing to publish a release without Developer ID signing and notarization credentials"
            exit 1
          fi
          echo "Unsigned or unnotarized development artifact produced; signing/notarization skipped (NOTARIZATION SKIPPED)."
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-app-release-${{ github.ref_name }}
          path: |
            dist-exe/*.dmg
            dist-exe/*.dmg.sha256
            dist-exe/*-release-manifest.json
            dist-exe/*-sbom.cdx.json
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.dry_run == false) && !contains(github.ref_name, '-preview.')
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deepseek-harness-app-release-${{ github.ref_name }}
          path: dist-exe
      - name: Tag and app version consistency
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('apps/desktop/src-tauri/tauri.conf.json','utf8')).version;if(process.env.TAG!=='v'+v){console.error('tag '+process.env.TAG+' does not match app version '+v);process.exit(1)}"
      - name: SBOM release gate
        run: |
          if [ -z "$(ls dist-exe/*-sbom.cdx.json 2>/dev/null)" ]; then
            echo "::error::No CycloneDX SBOM in the release assets; the publish gate requires one (see docs/project/SUPPLY-CHAIN.md)"
            exit 1
          fi
      - name: Refuse duplicate tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -e 'const fs=require("fs");const f=fs.readdirSync("dist-exe").find(n=>n.endsWith("-release-manifest.json"));process.stdout.write(JSON.parse(fs.readFileSync("dist-exe/"+f,"utf8")).version)')"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::refusing to publish $tag: the release already exists"
            exit 1
          fi
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist-exe/*.dmg
            dist-exe/*.dmg.sha256
            dist-exe/*-release-manifest.json
            dist-exe/*-sbom.cdx.json
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist-exe/*.dmg \
            dist-exe/*.dmg.sha256 \
            dist-exe/*-release-manifest.json \
            dist-exe/*-sbom.cdx.json \
            --title "DeepSeek Harness App ${{ github.ref_name }}" \
            --draft \
            --prerelease \
            --generate-notes

  publish-preview:
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.release_kind == 'preview') || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-preview.'))
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deepseek-harness-app-release-${{ github.ref_name }}
          path: dist-exe
      - name: Preview tag matches preview version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v.*-preview\. ]]; then
            echo "::error::Preview publication requires a v*-preview.* tag, got $TAG"
            exit 1
          fi
      - name: SBOM release gate
        run: |
          if [ -z "$(ls dist-exe/*-sbom.cdx.json 2>/dev/null)" ]; then
            echo "::error::No CycloneDX SBOM in the release assets; the publish gate requires one (see docs/project/SUPPLY-CHAIN.md)"
            exit 1
          fi
      - name: Refuse duplicate tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -e 'const fs=require("fs");const f=fs.readdirSync("dist-exe").find(n=>n.endsWith("-release-manifest.json"));process.stdout.write(JSON.parse(fs.readFileSync("dist-exe/"+f,"utf8")).version)')"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::refusing to publish $tag: the release already exists"
            exit 1
          fi
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist-exe/*.dmg
            dist-exe/*.dmg.sha256
            dist-exe/*-release-manifest.json
            dist-exe/*-sbom.cdx.json
      - name: Create preview GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          tag="v$(node -e 'const fs=require("fs");const f=fs.readdirSync("dist-exe").find(n=>n.endsWith("-release-manifest.json"));process.stdout.write(JSON.parse(fs.readFileSync("dist-exe/"+f,"utf8")).version)')"
          if [ "$DISPATCH" = "false" ] && [ "$tag" != "v$REF" ]; then
            echo "::error::Tag $REF does not match the preview manifest version $tag"
            exit 1
          fi
          title="DeepSeek Harness App $tag Public Preview — Unsigned / Not Notarized"
          notes="$RUNNER_TEMP/preview-notes.md"
          cat > "$notes" <<'PREVIEW_EOF'
          ## Public Preview

          macOS Apple Silicon only. No Node required. The app is usable.

          - Signing: ad-hoc
          - Notarized: no
          - Gatekeeper: macOS may show a warning on first launch; use System Settings → Privacy & Security → Open Anyway.

          Production notarized builds will be published later.
          PREVIEW_EOF
          gh release create "$tag" \
            dist-exe/*.dmg \
            dist-exe/*.dmg.sha256 \
            dist-exe/*-release-manifest.json \
            dist-exe/*-sbom.cdx.json \
            --title "$title" \
            --prerelease \
            --notes-file "$notes"
